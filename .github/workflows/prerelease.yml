name: Pre-release (every push)

# Build Apollo for macOS, Linux, and Windows on every push and publish a single per-commit
# pre-release with all platform artifacts attached. Release identity is the git commit
# (tag pre-<short-sha>); the numeric build version is derived from the git commit count by
# cmake/prep/build_version.cmake, so nothing version-related is tracked in-tree.
#
#   macOS   -> scripts/macos_build.sh + scripts/macos_package.sh (portable, dylib-bundled tarball)
#   Linux   -> scripts/linux_build.sh (official Sunshine build script; produces a .deb)
#   Windows -> MSYS2/MinGW64 + CMake + CPack NSIS installer (Sunshine's Windows toolchain)
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.v.outputs.short_sha }}
      count: ${{ steps.v.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS (arm64)
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos_deps.sh') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-
      - name: Install build dependencies
        run: ./scripts/macos_deps.sh
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-macos-arm64-${{ github.ref_name }}
          restore-keys: |
            ccache-macos-arm64-
          max-size: 2G
      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build-package/_deps
          key: fetchcontent-macos-arm64-${{ hashFiles('cmake/dependencies/**', 'CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-macos-arm64-
      - name: Build and package
        env:
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          SKIP_SUBMODULES: '1'
          CMAKE_EXTRA_ARGS: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
        run: ./scripts/macos_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz
          if-no-files-found: error

  linux:
    name: Linux (x86_64 .deb)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build (official linux_build.sh, CUDA skipped)
        env:
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          chmod +x ./scripts/linux_build.sh
          ./scripts/linux_build.sh --skip-cuda --ubuntu-test-repo --num-processors "$(nproc)" \
            --publisher-name "SudoMaker" \
            --publisher-website "https://www.sudomaker.com" \
            --publisher-issue-url "https://github.com/ClassicOldSong/Apollo/issues"
      - name: Collect package by commit
        run: |
          mkdir -p out
          PKG="$(find build -name '*.deb' | head -1)"
          test -n "$PKG" || { echo "No .deb produced"; find build -name '*.deb' -o -name '*.rpm'; exit 1; }
          cp "$PKG" "out/apollo-linux-x86_64-${{ needs.version.outputs.short_sha }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*.deb
          if-no-files-found: error

  windows:
    name: Windows (x64 installer)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-nlohmann-json
            mingw-w64-x86_64-nodejs
            mingw-w64-x86_64-nsis
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure & build
        env:
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME=SudoMaker \
            -DSUNSHINE_PUBLISHER_WEBSITE=https://www.sudomaker.com \
            -DSUNSHINE_PUBLISHER_ISSUE_URL=https://github.com/ClassicOldSong/Apollo/issues \
            -DBUILD_TESTS=OFF
          ninja -C build
      - name: Package (CPack NSIS)
        run: |
          cd build
          cpack -G NSIS || cpack -G ZIP
      - name: Collect installer by commit
        run: |
          mkdir -p out
          PKG="$(find build -name '*.exe' -path '*cpack_artifacts*' -o -name 'Apollo*.exe' | head -1)"
          if [ -z "$PKG" ]; then PKG="$(find build -name '*.exe' | grep -i -E 'apollo|sunshine|installer' | head -1)"; fi
          if [ -z "$PKG" ]; then PKG="$(find build -name '*.zip' -path '*cpack*' | head -1)"; fi
          test -n "$PKG" || { echo "No installer produced"; find build -name '*.exe' -o -name '*.zip'; exit 1; }
          ext="${PKG##*.}"
          cp "$PKG" "out/apollo-windows-x64-${{ needs.version.outputs.short_sha }}.${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: [version, macos, linux, windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -laR dist || true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ needs.version.outputs.short_sha }}
          name: Apollo pre-release ${{ needs.version.outputs.short_sha }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/**/*
          body: |
            Automated multi-platform pre-release.

            - Commit: `${{ github.sha }}`
            - Build version: `0.0.${{ needs.version.outputs.count }}`

            Artifacts: macOS arm64 portable tarball, Linux x86_64 .deb, Windows x64 installer.
            These are **unsigned** development builds.
